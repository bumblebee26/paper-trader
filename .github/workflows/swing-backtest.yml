name: Swing backtest

# Tests the swing-pool rules (system plan, phase 3) on the lakehouse's NSE daily prices and sends
# the result to Telegram. Plain Python, no Claude. Start it from Actions -> Swing backtest -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "study = tune on 12 months, judge on the last 6; original = the first four variants"
        type: choice
        options: [study, original]
        default: study
      send:
        description: Send the summary to Telegram
        type: boolean
        default: true

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  STATE_BUCKET: ${{ vars.TRADER_STATE_BUCKET }}
  TELEGRAM_TOKEN_PARAM: /stocks/telegram-bot-token
  TELEGRAM_CHAT_ID_PARAM: /stocks/telegram-chat-id
  DATABRICKS_URL_PARAM: /stocks/databricks-workspace-url
  DATABRICKS_TOKEN_PARAM: /stocks/databricks-pusher-token
  DATABRICKS_WAREHOUSE_PARAM: /stocks/databricks-warehouse-id

jobs:
  backtest:
    runs-on: ubuntu-latest
    environment: trading
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_TRADER_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_TRADER_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run the backtest
        env:
          SEND: ${{ inputs.send }}
          MODE: ${{ inputs.mode }}
        run: |
          args=""
          if [ "$MODE" = "original" ]; then args="--original"; fi
          if [ "$SEND" != "true" ]; then args="$args --no-send"; fi
          python backtest/run_swing.py $args
