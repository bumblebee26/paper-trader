name: Reset ledger

# Dummy money only. Puts every pool (intraday, swing, long-term and all shadow pools) back to its starting cash with
# nothing held, from the next trading day; keeps the trade history, ratings, test results, settings and rules.
# Archives the old state to archive/ledger-reset-<date>/ first. See jobs/reset_ledger.py.
# Don't run it while a session or the guardian is working (e.g. 15:40-15:55 or 23:25-23:40 IST).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RESET to reset (anything else is a dry run that changes nothing)
        required: true
        default: ""
      send:
        description: Tell Telegram
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ledger-reset
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  STATE_BUCKET: ${{ vars.TRADER_STATE_BUCKET }}
  TELEGRAM_TOKEN_PARAM: /stocks/telegram-bot-token
  TELEGRAM_CHAT_ID_PARAM: /stocks/telegram-chat-id

jobs:
  reset:
    runs-on: ubuntu-latest
    environment: trading
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_TRADER_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_TRADER_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Reset (or dry run)
        env:
          CONFIRM: ${{ inputs.confirm }}
          SEND: ${{ inputs.send }}
        run: |
          args=(--confirm "$CONFIRM")
          if [ "$SEND" != "true" ]; then args+=(--no-send); fi
          python jobs/reset_ledger.py "${args[@]}"
