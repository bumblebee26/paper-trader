name: History backtests

# Phase 3 step 4: the swing ideas (momentum, scanner, 52-week high, chart patterns, rally-range) on the lakehouse's
# NSE prices 2019-2026, judged on 2020-2024 and once on the held-back 2025-2026. Plain Python, no Claude.
# Start it from Actions -> History backtests -> Run workflow. Results: job summary and log, S3, Telegram.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated ideas to run (blank = all): momentum,scanner,high52,dbl_bottom,bull_flag,rally_range"
        type: string
        default: ""
      send:
        description: Send the summary to Telegram
        type: boolean
        default: true

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  STATE_BUCKET: ${{ vars.TRADER_STATE_BUCKET }}
  TELEGRAM_TOKEN_PARAM: /stocks/telegram-bot-token
  TELEGRAM_CHAT_ID_PARAM: /stocks/telegram-chat-id
  DATABRICKS_URL_PARAM: /stocks/databricks-workspace-url
  DATABRICKS_TOKEN_PARAM: /stocks/databricks-pusher-token
  DATABRICKS_WAREHOUSE_PARAM: /stocks/databricks-warehouse-id

jobs:
  backtest:
    runs-on: ubuntu-latest
    environment: trading
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_TRADER_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_TRADER_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run the backtests
        env:
          SEND: ${{ inputs.send }}
          ONLY: ${{ inputs.only }}
        run: |
          args=""
          if [ -n "$ONLY" ]; then args="--only $ONLY"; fi
          if [ "$SEND" != "true" ]; then args="$args --no-send"; fi
          python backtest/run_history.py $args

