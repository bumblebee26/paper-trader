name: Long-term backtest

# Tests the long-term pool's selection rules (system plan, phase 4) on lakehouse data and sends the
# result to Telegram. Plain Python, no Claude. Actions -> Long-term backtest -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      universe:
        description: "nifty200 = today's index list; traded = the 250 most traded stocks of Apr-Jun 2025 (no hindsight)"
        type: choice
        options: [nifty200, traded]
        default: nifty200
      send:
        description: Send the summary to Telegram
        type: boolean
        default: true

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  STATE_BUCKET: ${{ vars.TRADER_STATE_BUCKET }}
  TELEGRAM_TOKEN_PARAM: /stocks/telegram-bot-token
  TELEGRAM_CHAT_ID_PARAM: /stocks/telegram-chat-id
  DATABRICKS_URL_PARAM: /stocks/databricks-workspace-url
  DATABRICKS_TOKEN_PARAM: /stocks/databricks-pusher-token
  DATABRICKS_WAREHOUSE_PARAM: /stocks/databricks-warehouse-id

jobs:
  backtest:
    runs-on: ubuntu-latest
    environment: trading
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_TRADER_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_TRADER_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run the backtest
        env:
          SEND: ${{ inputs.send }}
          UNIVERSE: ${{ inputs.universe }}
        run: |
          args="--universe=$UNIVERSE"
          if [ "$SEND" != "true" ]; then args="$args --no-send"; fi
          python backtest/run_longterm.py $args
